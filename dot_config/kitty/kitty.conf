# kitty for the mugzx desktop. Colours match the Quickshell bar
# (~/.config/quickshell/mugzx/Theme.qml).
# ctrl+shift+f2 opens this file, ctrl+shift+f5 reloads it.

# ---- font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Pin Chinese to the Simplified Chinese face instead of leaving it to
# fontconfig fallback, which can pick the Japanese/Korean variants.
symbol_map U+3000-U+303F,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Noto Sans Mono CJK SC
# Nerd Font icons are built into kitty; nothing extra to install.

# ---- cursor: thin beam that leaves a short trail when it jumps
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_trail          3
cursor_trail_decay    0.1 0.4

# ---- scrollback and mouse
scrollback_lines      10000
mouse_hide_wait       2.0
url_style             curly
strip_trailing_spaces smart

# ---- responsiveness: repaint sooner after output and input
repaint_delay   8
input_delay     2
sync_to_monitor yes

# ---- bell
enable_audio_bell    no
visual_bell_duration 0

# ---- window
remember_window_size    no
initial_window_width    1100
initial_window_height   700
window_padding_width    8 10
hide_window_decorations yes
background_opacity      0.92
# Ask before closing a window that is still running something.
confirm_os_window_close -1

# Splits; ctrl+shift+l toggles to "stack" to zoom the current split.
enabled_layouts       splits,stack
window_border_width   1pt
active_border_color   #8fb8ff
inactive_border_color #1c2230
inactive_text_alpha   0.85

# ---- tab bar (only shown with two or more tabs)
tab_bar_edge            top
tab_bar_margin_height   4 0
tab_bar_style           powerline
tab_powerline_style     round
tab_title_template      "{index} {title}"
tab_title_max_length    32
active_tab_font_style   bold
inactive_tab_font_style normal

# ---- shell integration extras
# Desktop notification when a command that ran 15s+ finishes off-screen.
notify_on_cmd_finish invisible 15.0
# pacman handles updates.
update_check_interval 0

# ---- colours
foreground           #e8edf5
background           #0c1017
selection_foreground none
selection_background #26354f
cursor               #8fb8ff
cursor_text_color    background
url_color            #8fb8ff

tab_bar_background      #0c1017
active_tab_foreground   #0a0d12
active_tab_background   #8fb8ff
inactive_tab_foreground #9aa4b5
inactive_tab_background #161b25

# black
color0  #1c2230
color8  #5d6676
# red
color1  #eb7a7a
color9  #f29b9b
# green
color2  #9ad89a
color10 #b6e6b0
# yellow
color3  #e9c18e
color11 #f2d3a8
# blue
color4  #8fb8ff
color12 #b1ceff
# magenta
color5  #c3a6ff
color13 #d6c2ff
# cyan
color6  #8fd3d6
color14 #b0e3e5
# white
color7  #c8d0dc
color15 #e8edf5

# ---- keys (kitty_mod = ctrl+shift; everything else stays default)
# New tab / split open in the current directory.
map kitty_mod+t     launch --type=tab --cwd=current
map kitty_mod+enter launch --location=split --cwd=current
# Move between splits.
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down
