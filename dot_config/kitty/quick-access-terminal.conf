# Drop-down terminal on SUPER+` (kitten quick-access-terminal); press again to hide.
edge top
lines 22
margin_top 8
margin_left 160
margin_right 160
background_opacity 0.82
hide_on_focus_loss yes
# The overlay layer can break fcitx5 input; top keeps Chinese typing working.
layer top
kitty_override window_padding_width=10 14
