# A small, cohesive Hyprland session. KDE remains available from the login screen.
$mainMod = SUPER
$terminal = /home/neomelt/.local/bin/mugzx-term
$menu = /home/neomelt/.local/bin/mugzx-launcher

# Laptop panel: 3072x1920 @120Hz at 1.6 scale -> crisp 1920x1200 logical.
# External HDMI: 2560x1600 @60Hz at scale 2, placed to the right.
monitor = eDP-1,3072x1920@120,0x0,1.6
monitor = HDMI-A-1,2560x1600@60,1920x0,2
monitor = ,preferred,auto,1
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,kde
env = QT_STYLE_OVERRIDE,Breeze
env = TERMINAL,kitty
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /home/neomelt/.local/bin/hyprland-uwsm-finalize
exec-once = fcitx5 -d
exec-once = /home/neomelt/.local/bin/mugzx-startup
exec-once = /home/neomelt/.local/bin/hypridle

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(f2f2f2ff)
    col.inactive_border = rgba(414141cc)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 7
    active_opacity = 0.98
    inactive_opacity = 0.94
    dim_inactive = true
    dim_strength = 0.12
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000055)
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, easeOut
    animation = windowsIn, 1, 4, easeOut, popin 80%
    animation = windowsOut, 1, 3, easeOut, popin 80%
    animation = border, 1, 5, easeOut
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 4, easeOut, slide
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

bind = $mainMod, RETURN, exec, $terminal
bind = CTRL ALT, T, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, SPACE, togglefloating
bind = $mainMod, E, exec, dolphin
bind = $mainMod SHIFT, E, exit

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, /home/neomelt/.local/bin/mugzx-brightness up
bindel = , XF86MonBrightnessDown, exec, /home/neomelt/.local/bin/mugzx-brightness down
bind = $mainMod, V, exec, /home/neomelt/bin/qwen-voice-toggle.sh
bind = $mainMod, C, exec, /home/neomelt/.local/bin/mugzx-clipboard
bind = $mainMod, GRAVE, exec, kitten quick-access-terminal

# --- quality of life ---
# Move / resize with the mouse (SUPER + left/right drag)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Lock / power menu / built-in help
bind = $mainMod, ESCAPE, exec, /home/neomelt/.local/bin/lock-and-sleep
bind = $mainMod SHIFT, P, exec, /home/neomelt/.local/bin/mugzx-power
bind = , F1, exec, $terminal /home/neomelt/.local/bin/mugzx-keys

# Screenshots (PRINT: menu, SUPER+P: region, SUPER+SHIFT+S: full screen)
bind = , PRINT, exec, /home/neomelt/.local/bin/mugzx-shot
bind = $mainMod, P, exec, /home/neomelt/.local/bin/mugzx-screenshot region
bind = $mainMod SHIFT, S, exec, /home/neomelt/.local/bin/mugzx-screenshot full

# Screen recording (toggle; focused monitor + system audio)
bind = $mainMod SHIFT, R, exec, /home/neomelt/.local/bin/mugzx-record

# Cycle windows / maximize / keyboard resize
bind = $mainMod, TAB, cyclenext
bind = $mainMod, TAB, bringactivetotop
bind = $mainMod, M, fullscreen, 1
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive, 40 0
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, J, resizeactive, 0 40

# Media keys
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

