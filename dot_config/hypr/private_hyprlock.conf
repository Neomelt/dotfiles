# Dark anime lock screen for the mugzx Hyprland session.
$font = JetBrains Mono

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = /home/neomelt/Pictures/Wallpapers/anime-girls.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.05
    vibrancy = 0.20
    vibrancy_darkness = 0.25
}

shape {
    monitor =
    size = 480, 340
    rounding = 20
    color = rgba(8, 11, 16, 0.88)
    border_size = 1
    border_color = rgba(143, 184, 255, 0.25)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 92
    font_family = $font
    color = rgba(245, 245, 245, 1.0)
    position = 0, 78
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 16
    font_family = Noto Sans
    color = rgba(175, 178, 185, 1.0)
    position = 0, 12
    halign = center
    valign = center
}

label {
    monitor =
    text = neomelt
    font_size = 13
    font_family = Noto Sans
    color = rgba(150, 155, 165, 0.95)
    position = 0, -42
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 310, 48
    outline_thickness = 1
    inner_color = rgba(8, 11, 16, 0.75)
    outer_color = rgba(143, 184, 255, 0.30)
    check_color = rgba(143, 230, 143, 0.9)
    fail_color = rgba(235, 115, 115, 0.95)
    font_color = rgba(238, 240, 244, 1.0)
    font_family = $font
    placeholder_text = 输入密码…
    fail_text = $PAMFAIL
    rounding = 12
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -112
    halign = center
    valign = center
}
